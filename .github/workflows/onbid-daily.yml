name: 경매·공매 상가·주택 일일 수집

on:
  schedule:
    # 매일 07:37 KST = 전날 22:37 UTC (KST = UTC+9). 정각은 Actions 대기열이 몰려 지연되므로 피함
    - cron: "37 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: onbid-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 1) 물건 수집 (onbid_collect2.py)
        # 재시도 후에도 일부 지역을 못 받으면 아무것도 저장하지 않고 실패로 끝난다.
        # 그래도 경매 수집·웹페이지는 나가야 하므로 계속 진행하고, 텔레그램이 '공매 수집 파일 없음'을 경고한다.
        continue-on-error: true
        env:
          ONBID_KEY: ${{ secrets.ONBID_KEY }}
        run: python onbid_collect2.py

      - name: 1-2) 법원경매 수집 (court_collect.py)
        # 법원경매 사이트가 해외 IP를 막거나 구조가 바뀌어도 온비드 쪽은 계속 돌도록 한다.
        # 실패하면 그날 텔레그램에는 공매만 나간다.
        continue-on-error: true
        run: python court_collect.py

      - name: 1-3) 법원경매 권리분석 (court_rights.py)
        # TOP 20 의 매각물건명세서로 인수위험을 판정해 court CSV 에 덮어쓴다.
        # 실패해도 court CSV 는 수집 결과 그대로 남고, 텔레그램·사이트는 예전 물건비고 방식으로 판정한다.
        # 이름 검사에 걸려 저장을 막은 경우는 아래 '이름 검사' 단계가 실행을 실패시킨다.
        continue-on-error: true
        run: python court_rights.py

      - name: 2) 상세정보 조회 (onbid_detail.py)
        # API 장애로 상세조회가 전부 실패해도 스크립트는 경고만 남기고 목록 데이터로 CSV를 만든다.
        # 예기치 못한 오류로 죽더라도 경매 데이터와 웹페이지는 나가도록 여기서도 건다.
        continue-on-error: true
        env:
          ONBID_KEY: ${{ secrets.ONBID_KEY }}
        run: python onbid_detail.py

      - name: 3) 수익성/권리분석 컬럼 추가 (onbid_add_metrics.py)
        continue-on-error: true
        run: python onbid_add_metrics.py

      - name: 신규 물건 요약 (Job Summary)
        run: python onbid_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: 텔레그램 알림 (onbid_telegram.py)
        # 스크립트도 전송 실패 시 exit 0 이지만, 예기치 못한 오류까지 막기 위해 한 번 더 건다.
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python onbid_telegram.py

      - name: 이름 검사 (name_guard.py)
        # 그날 court CSV 전체와 권리분석 캐시에 사람 이름처럼 보이는 문자열이 있으면 실패시켜
        # 커밋·배포를 막는다. continue-on-error 를 걸지 않는다.
        run: python name_guard.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore: 경매·공매 데이터 자동 수집 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 웹페이지 생성 (build_site.py)
        run: python build_site.py

      - name: Pages 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 실패 알림 (텔레그램)
        # 수집·이름 검사·커밋 등 앞 단계가 실패해 위 텔레그램 단계까지 못 갔을 때도 조용히 끝나지 않게 한다.
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 경매·공매 일일 수집 워크플로가 실패했습니다. 데이터·웹페이지가 갱신되지 않았을 수 있습니다. ${RUN_URL}" || true

  deploy:
    # 수집 데이터 커밋이 끝난 뒤에 배포한다. 저장소 Settings > Pages > Source 를 'GitHub Actions' 로 둬야 한다.
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
